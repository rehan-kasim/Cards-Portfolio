<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../src/output.css">
</head>
<body class="dark:bg-black flex items-center flex-col bg-orange-200">
    <div class="text-center mt-60">
        <label id="time" class="font-display text-white font-bold text-7xl">00:00.00</label><br>
        <button id="start" class="mt-5 dark:text-orange-100 text-white font-bold text-4xl font-display px-4 p-3 bg-neutral-500 dark:bg-green-500 rounded-2xl">Start</button>
        <button id="stop" class="dark:text-orange-100 text-white font-bold text-4xl font-display px-4 p-3 bg-neutral-500 dark:bg-orange-500 rounded-2xl">Stop</button>
        <button id="reset" class="dark:text-orange-100 text-white font-bold text-4xl font-display px-4 p-3 bg-neutral-500 dark:bg-red-500 rounded-2xl">Reset</button>
    </div>
    <script src="stopwatch.js"></script>
</body>
</html>
