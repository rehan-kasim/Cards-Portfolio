<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="../src/output.css">
</head>
<body class="bg-orange-100 text-neutral-900 dark:bg-black dark:text-orange-50">
    <div class="max-w-3xl mx-auto px-6 py-10">
        <main>
            <p class="font-display font-bold text-4xl text-orange-700 dark:text-orange-400">
                Tasks
            </p>
            <p class="mt-3 text-neutral-600 dark:text-neutral-400">
                Things You Should Do
            </p>
            <div id="todo-form" class="mt-10 flex gap-3">
                <input id="task-name" type="text" placeholder="What Should I Add ?" class="min-w-0 flex-1 rounded-xl border-2 border-orange-200 bg-white px-5 py-4 text-xl placeholder:text-neutral-400 focus:outline-none focus:border-orange-700 dark:bg-neutral-900 dark:border-neutral-700">
                <button id="submit" class="rounded-xl bg-orange-700 px-7 py-4 font-display font-bold text-white hover:bg-orange-500 active:scale-95 transition">
                    +
                </button> 
            </div>
            <div id="header" class="mt-5 flex flex-wrap  justify-between items-center gap-4">
                <p class="font-display font-bold text-2xl">
                    Your Tasks
                </p>
                <p id="task-counter" class="text-orange-700 dark:text-orange-400">
                    0 Tasks left
                </p>
            </div>

            <button id="all" class="border-2 border-orange-800 bg-orange-200 dark:border-neutral-800 dark:bg-neutral-700 px-3 py-1 rounded-2xl hover:opacity-90 active:bg-orange-700 dark:active:bg-neutral-800">All</button>
            <button id="completed" class="border-2 border-orange-800 bg-orange-200 dark:border-neutral-800 dark:bg-neutral-700 px-3 py-1 rounded-2xl hover:opacity-90 active:bg-orange-700 dark:active:bg-neutral-800">Completed</button>
            <button id="pending" class="border-2 border-orange-800 bg-orange-200 dark:border-neutral-800 dark:bg-neutral-700 px-3 py-1 rounded-2xl hover:opacity-90 active:bg-orange-700 dark:active:bg-neutral-800">Pending</button>

            <div id="todo-list" class="mt-8 space-y-4">
            </div>
        </main>
        <footer class="mt-32 border-t border-orange-300 dark:border-neutral-800 pt-6">
            <p class="font-display font-bold text-xl">Made by <a href="../index.html" class="underline text-blue-400 hover:text-blue-500">Rehan Kasim ©</a></p>
            <p class="text-neutral-500 dark:text-neutral-300 text-base">Now Go Finish Your Tasks</p>
        </footer>
    </div>
    
    <script src="todo.js"></script>
</body>
</html>
