<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="../src/output.css">
    <link rel="icon" href="../assets/calculator.svg">
</head>
<body class="dark:bg-neutral-900 flex flex-col items-center text-white">
    <div class="w-100 mt-10 border border-gray-600 bg-gray-600 rounded-4xl shadow-md">
        <p class="text-4xl ml-28 mt-10 mb-3 font-bold font-display">Calculator</p>
        <input type="text" id="display" class="ml-12 h-12 w-75 text-right px-3 text-2xl font-mono border border-gray-700 rounded bg-gray-950 text-white mb-4 focus:outline-none" readonly>
        <div id="numpad" class="grid grid-cols-4 m-10 gap-2 mt-2 h-100">
            <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="cleardisplay()">C</button>
            <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="addDisplay('/')">/</button>
            <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="addDisplay('*')">×</button>
            <button class="bg-red-900/50 hover:bg-red-900/60 text-red-200 py-3 rounded text-lg font-medium transition" onclick="deletelastchar()">⌫</button>

            <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="addDisplay('7')">7</button>
            <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="addDisplay('8')">8</button>
            <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="addDisplay('9')">9</button>
            <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-mdeium transition" onclick="addDisplay('-')">-</button>

            <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="addDisplay('4')">4</button>
            <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="addDisplay('5')">5</button>
            <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="addDisplay('6')">6</button>
            <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="addDisplay('+')">+</button>

            <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="addDisplay('1')">1</button>
            <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="addDisplay('2')">2</button>
            <button class="bg-gray-800 hover:bg-gray-800 py-3 rounded text-lg font-medium transition" onclick="addDisplay('3')">3</button>
            <button class="row-span-2 bg-blue-600 hover:bg-blue-500 text-white rounded text-lg font-medium transition" onclick="calculate()">=</button>

            <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium col-span-2 transition" onclick="addDisplay('0')">0</button>
            <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="addDisplay('.')">.</button>
        </div>
    </div>
    <script src="calculator.js"></script>
</body>
</html>
